note: >-
  Citus is a PostgreSQL extension, not an HTTP API, so it ships no language client
  SDKs. Its first-party distribution is the extension itself (apt/yum packages built
  from the citusdata/packaging repo) and an official Docker image. Applications connect
  using any standard PostgreSQL driver over the Postgres wire protocol.
