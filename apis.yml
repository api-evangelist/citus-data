aid: citus-data
name: Citus Data
description: >-
  Citus Data is the company behind Citus, an open source extension that turns PostgreSQL
  into a distributed database. Rather than forking Postgres, Citus adds sharding, distributed
  tables, reference tables, and a distributed query planner so applications can scale out
  across many nodes while keeping full SQL, ACID transactions, and the entire Postgres
  ecosystem. It is used for multi-tenant SaaS applications, real-time analytics dashboards,
  and microservices architectures. Founded in San Francisco and acquired by Microsoft in
  2019, Citus is developed in the open on GitHub and is also offered as a managed cloud
  service (Azure Cosmos DB for PostgreSQL); its reference documentation is hosted on
  Microsoft Learn. Citus is consumed over the standard PostgreSQL wire protocol and SQL,
  so it exposes no REST/HTTP API, no OAuth surface, and no language SDKs of its own.
